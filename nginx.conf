# Nginx конфиг для errani.ru + admin.errani.ru
# Файл: /etc/nginx/sites-available/errani.ru
# Симлинк: ln -s /etc/nginx/sites-available/errani.ru /etc/nginx/sites-enabled/

# Редирект HTTP → HTTPS (errani.ru + admin.errani.ru)
server {
    listen 80;
    listen [::]:80;
    server_name errani.ru www.errani.ru admin.errani.ru;
    return 301 https://$host$request_uri;
}

# Редирект www → без www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.errani.ru;

    ssl_certificate     /etc/letsencrypt/live/errani.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errani.ru/privkey.pem;

    return 301 https://errani.ru$request_uri;
}

# Основной сервер errani.ru
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name errani.ru;

    ssl_certificate     /etc/letsencrypt/live/errani.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errani.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Максимальный размер загружаемых файлов (для медиа)
    client_max_body_size 20M;

    # Статика Next.js — кэш 1 год
    location /_next/static/ {
        alias /var/www/errani/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиафайлы из /public
    location /media/ {
        alias /var/www/errani/public/media/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # Disable script execution inside media
    location ~* ^/media/.*\.(php|php5|phtml|js|html|sh|py)$ {
        deny all;
    }

    # Product uploads from admin
    location /uploads/ {
        alias /var/www/errani/public/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # Disable script execution inside uploads
    location ~* ^/uploads/.*\\.(php|php5|phtml|js|html|sh|py)$ {
        deny all;
    }

    location /fonts/ {
        alias /var/www/errani/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /logos/ {
        alias /var/www/errani/public/logos/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Все остальное → Next.js (порт 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Admin subdomain: admin.errani.ru → errani.ru/admin/
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.errani.ru;

    ssl_certificate     /etc/letsencrypt/live/errani.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errani.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Serve Next.js static assets
    location /_next/static/ {
        alias /var/www/errani/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve uploaded images directly on admin domain too
    location /media/ {
        alias /var/www/errani/public/media/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* ^/media/.*\.(php|php5|phtml|js|html|sh|py)$ {
        deny all;
    }

    # Serve uploaded images directly on admin domain too
    location /uploads/ {
        alias /var/www/errani/public/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* ^/uploads/.*\\.(php|php5|phtml|js|html|sh|py)$ {
        deny all;
    }

    # Rewrite root to /admin/
    location = / {
        return 301 https://admin.errani.ru/admin/;
    }

    # Proxy all traffic to Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host errani.ru;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host admin.errani.ru;
        proxy_cache_bypass $http_upgrade;
    }
}
