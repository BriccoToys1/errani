# Nginx конфиг для errani.ru + admin.errani.ru
# Файл: /etc/nginx/sites-available/errani.ru
# Симлинк: ln -s /etc/nginx/sites-available/errani.ru /etc/nginx/sites-enabled/
#
# ТРЕБОВАНИЯ ПЕРЕД ДЕПЛОЕМ:
#   1. Сгенерировать DH-параметры (однократно):
#      openssl dhparam -out /etc/nginx/dhparam.pem 2048
#   2. Убедиться, что модуль ngx_http_realip_module активен:
#      nginx -V 2>&1 | grep realip
#   3. После изменений: nginx -t && systemctl reload nginx

# ---------------------------------------------------------------------------
# Cloudflare Real IP — восстанавливаем IP посетителя из заголовка CF-Connecting-IP,
# чтобы rate limiting и логи отражали реальный адрес, а не IP Cloudflare.
# Актуальные диапазоны: https://www.cloudflare.com/ips/
# ---------------------------------------------------------------------------
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;

# ---------------------------------------------------------------------------
# Rate limiting zones
# admin_login: 20 попыток/мин на IP — защита от брутфорса без ложных 429
# api_write:   30 req/s  — общий лимит для write-запросов
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_write:10m   rate=30r/s;

# ---------------------------------------------------------------------------
# Редирект HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name errani.ru www.errani.ru admin.errani.ru;

    server_tokens off;

    # ACME challenge для Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Редирект www → без www
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.errani.ru;

    server_tokens off;

    ssl_certificate          /etc/letsencrypt/live/errani.ru/fullchain.pem;
    ssl_certificate_key      /etc/letsencrypt/live/errani.ru/privkey.pem;
    ssl_trusted_certificate  /etc/letsencrypt/live/errani.ru/chain.pem;
    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache        shared:SSL:10m;
    ssl_session_timeout      1d;
    ssl_session_tickets      off;
    ssl_dhparam              /etc/nginx/dhparam.pem;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    return 301 https://errani.ru$request_uri;
}

# ---------------------------------------------------------------------------
# Основной сервер errani.ru
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name errani.ru;

    server_tokens off;

    ssl_certificate          /etc/letsencrypt/live/errani.ru/fullchain.pem;
    ssl_certificate_key      /etc/letsencrypt/live/errani.ru/privkey.pem;
    ssl_trusted_certificate  /etc/letsencrypt/live/errani.ru/chain.pem;
    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache        shared:SSL:10m;
    ssl_session_timeout      1d;
    ssl_session_tickets      off;
    ssl_dhparam              /etc/nginx/dhparam.pem;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    client_max_body_size 20M;

    # Gzip (резервный сжиматель, если Cloudflare отключён)
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Заголовки безопасности — дублируем Next.js для статических файлов,
    # которые Next.js не обслуживает напрямую.
    add_header X-Frame-Options          "DENY"                           always;
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Статика Next.js — кэш 1 год
    location /_next/static/ {
        alias /var/www/errani/.next/static/;
        expires 1y;
        add_header Cache-Control       "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Медиафайлы из /public
    location /media/ {
        alias /var/www/errani/public/media/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control       "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # Запрет выполнения скриптов в /media/
    location ~* ^/media/.*\.(php|php5|phtml|js|html|sh|py|cgi)$ {
        deny all;
    }

    # Загрузки из админки
    location /uploads/ {
        alias /var/www/errani/public/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control       "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # Запрет выполнения скриптов в /uploads/ (было \\. — баг, исправлено на \.)
    location ~* ^/uploads/.*\.(php|php5|phtml|js|html|sh|py|cgi)$ {
        deny all;
    }

    location /fonts/ {
        alias /var/www/errani/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /logos/ {
        alias /var/www/errani/public/logos/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Rate limit на эндпоинт входа в админку
    location = /api/admin/login {
        limit_req        zone=admin_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Все остальное → Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------------------------------------------------------------------------
# Admin subdomain: admin.errani.ru → errani.ru/admin/
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.errani.ru;

    server_tokens off;

    ssl_certificate          /etc/letsencrypt/live/errani.ru/fullchain.pem;
    ssl_certificate_key      /etc/letsencrypt/live/errani.ru/privkey.pem;
    ssl_trusted_certificate  /etc/letsencrypt/live/errani.ru/chain.pem;
    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache        shared:SSL:10m;
    ssl_session_timeout      1d;
    ssl_session_tickets      off;
    ssl_dhparam              /etc/nginx/dhparam.pem;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    client_max_body_size 20M;

    # Запрет индексации панели управления поисковиками
    add_header X-Robots-Tag              "noindex, nofollow"              always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /_next/static/ {
        alias /var/www/errani/.next/static/;
        expires 1y;
        add_header Cache-Control       "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location /media/ {
        alias /var/www/errani/public/media/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control       "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* ^/media/.*\.(php|php5|phtml|js|html|sh|py|cgi)$ {
        deny all;
    }

    location /uploads/ {
        alias /var/www/errani/public/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control       "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* ^/uploads/.*\.(php|php5|phtml|js|html|sh|py|cgi)$ {
        deny all;
    }

    # Rate limit на страницу входа в админку
    location = /admin/login {
        limit_req        zone=admin_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              errani.ru;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  admin.errani.ru;
        proxy_cache_bypass $http_upgrade;
    }

    location /fonts/ {
        alias /var/www/errani/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location /admin/fonts/ {
        alias /var/www/errani/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Прямой вход в админку без лишней цепочки редиректов.
    location = / {
        return 302 https://admin.errani.ru/admin/login;
    }

    # Все запросы → Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              errani.ru;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  admin.errani.ru;
        proxy_cache_bypass $http_upgrade;
    }
}
