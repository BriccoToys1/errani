name: Deploy to reg.ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 168.222.143.43
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/errani-new
            git pull origin main
            npm install
            npx prisma generate
            npm run build
            pm2 restart errani-site
            echo "✅ Деплой завершён"
